# Render Blueprint — https://docs.render.com/docs/infrastructure-as-code
# After deploy, set secrets in the dashboard (or via render env):
#   DataCon__ConnectionString, QrOrdering__PublicSiteUrl (use https://<service>.onrender.com)
services:
  - type: web
    name: self-ordering-kiosk
    runtime: docker
    # Build from repo root so ./Dockerfile exists (see monorepo Dockerfile).
    rootDir: SelfOrderingSystemKiosk
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
